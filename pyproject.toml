[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobagent"
version = "0.1.0"
description = "Automated job application system using RAG, scraping, and browser automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llama-index-embeddings-ollama>=0.6.0",
    "llama-index-llms-ollama>=0.5.3",
    "llama-index-readers-smart-pdf-loader>=0.3.0",
    "llama-index-vector-stores-postgres>=0.4.2",
    "pre-commit>=4.2.0",
    "python-dotenv>=1.1.0",
    "ruff>=0.11.2",
    "sqlalchemy>=2.0.39",
    "transformers==4.45.2",
    "python-jobspy @ file:///home/zheng/github/JobSpy",
    "langgraph>=0.3.25",
    "langchain-postgres>=0.0.13",
    "langchain-community==0.3.10",
    "langchain-ollama==0.2.2",
    "pypdf>=5.4.0",
    "playwright>=1.51.0",
    "browser-use>=0.1.30",
    "langchain-google-genai>=2.0.8",
]

[project.scripts]
jobagent = "job_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["job_agent*"]
exclude = []
